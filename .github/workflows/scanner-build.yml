name: scanner-build

on:
  push:
    paths:
      - "scanner/**"
      - ".github/workflows/scanner-build.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: scanner

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: scanner/go.mod
          cache-dependency-path: scanner/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: scanner/go.mod
          cache-dependency-path: scanner/go.sum

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/terragraph-${GOOS}-${GOARCH}${ext}" ./cmd/terragraph

      # Action inputs are relative to the repo root, not the run working-directory.
      - uses: actions/upload-artifact@v4
        with:
          name: terragraph-${{ matrix.goos }}-${{ matrix.goarch }}
          path: scanner/dist/
          if-no-files-found: error
