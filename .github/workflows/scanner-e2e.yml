name: scanner-e2e

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: scanner

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: scanner/go.mod
          cache-dependency-path: scanner/go.sum

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Build CLI
        run: go build -o "$RUNNER_TEMP/terragraph" ./cmd/terragraph

      - name: Scan sample project without init
        run: |
          "$RUNNER_TEMP/terragraph" scan --mode project --path testdata/sample-project --out sample-report.json
          cat sample-report.json
          jq -e '(.facts | length) == 5 and all(.facts[]; .resolution_source == "source-parse")' sample-report.json > /dev/null || {
            echo "::error::Expected 5 module calls, all resolved from source"
            exit 1
          }

      - name: Scan public modules after terraform get
        run: |
          terraform -chdir=testdata/public-modules get
          "$RUNNER_TEMP/terragraph" scan --mode project --path testdata/public-modules --out public-report.json
          cat public-report.json
          jq -e '(.facts | length) == 2 and all(.facts[]; .resolution_source == "modules-json" and (.ref_resolved | test("^[0-9a-f]{40}$")))' public-report.json > /dev/null || {
            echo "::error::Expected 2 module calls, all resolved to exact commits"
            exit 1
          }
          jq -e 'any(.facts[]; .call_name == "s3_bucket" and (.version_resolved // "" | startswith("4.")))' public-report.json > /dev/null || {
            echo "::error::Expected s3_bucket to report the exact 4.x version terraform selected"
            exit 1
          }

      - name: Scan module repo
        run: |
          "$RUNNER_TEMP/terragraph" scan --mode module-repo --repo-url https://github.com/terraform-aws-modules/terraform-aws-vpc.git --out module-report.json
          jq '.facts | length' module-report.json
          jq -e 'any(.facts[]; .tag == "v5.1.0" and .semver == "5.1.0")' module-report.json > /dev/null || {
            echo "::error::Expected tag v5.1.0 in terraform-aws-vpc"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-reports
          path: scanner/*-report.json
          if-no-files-found: ignore
