name: server-build

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server-build.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: server

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: terragraph
          POSTGRES_PASSWORD: terragraph
          POSTGRES_DB: terragraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terragraph -d terragraph"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TERRAGRAPH_TEST_DATABASE_URL: postgres://terragraph:terragraph@localhost:5432/terragraph?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check generated UI files are current
        working-directory: .
        run: |
          make generate
          changed=$(git status --porcelain -- server/internal/web)
          if [ -n "$changed" ]; then
            echo "::error::Generated UI files are stale. Run make generate and commit the result."
            echo "$changed"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t terragraph-server:${{ github.sha }} .
